<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知航</title><link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg?v=20261021-zhihang"><link rel="stylesheet" href="/assets/research.css?v=20261020-mode-isolation"><link rel="stylesheet" href="/assets/site-navigation.css"><link rel="stylesheet" href="/assets/article.css?v=20261021-ai-markdown"></head>
<body>
<a class="skip" href="#question">跳到输入框</a>
<header class="site-header"><a class="brand" href="/#page/news"><img src="/assets/brand.svg" width="48" height="48" alt=""><span class="brand-wordmark"><strong>知航</strong></span></a><nav aria-label="主导航"><a href="/#page/news">航天新闻</a><a href="/assets/research.html" class="active" aria-current="page">研究助手</a><a href="/assets/resource-navigation.html">资源导航</a></nav><a class="header-about" href="/assets/guides.html">使用指南</a></header>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="研究记录"><div class="side-head"><span>研究空间</span><button class="icon mobile" id="close-sidebar" aria-label="关闭研究列表">×</button></div><button id="new-work" class="new-work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建研究</button><div class="history-label">最近研究</div><div id="work-list" class="work-list"></div><div class="side-bottom"><p id="storage-note">记录仅存于此浏览器，保留 7 天。</p><span>知航 · 研究助手</span></div></aside>
<button id="sidebar-shade" class="shade" aria-label="关闭研究列表" hidden></button>
<main class="workspace" data-empty="true">
<div class="research-art" aria-hidden="true">
<img class="research-art-station" src="/assets/tiangong-lineart-v2.png" alt="">
<img class="research-art-rocket" src="/assets/long-march-5-lineart-transparent.png" alt="">
<img class="research-art-shenzhou" src="/assets/shenzhou-lineart-transparent.png" alt="">
<img class="research-art-satellite" src="/assets/satellite-lineart-transparent.png" alt="">
<img class="research-art-change6" src="/assets/change-6-lander-ascender-lineart-v2.png" alt="">
</div>
<div class="workbar">
 <div class="work-identity"><button id="open-sidebar" class="history-toggle" aria-label="打开研究列表" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16"/></svg><span>研究记录</span></button><h1 id="work-title">新的研究</h1><span id="work-type">论文与知识</span></div>
 <div class="mode-switch" role="group" aria-label="工作模式"><button type="button" data-mode="knowledge" aria-pressed="false">知识问答</button><button type="button" data-mode="papers" aria-pressed="true">论文查找</button></div>
 <div class="work-actions"><button id="quick-new" class="text-button">新建</button><button id="rename-work" class="text-button">重命名</button><button id="delete-work" class="text-button">删除</button></div>
</div>
<div class="stage">
 <div class="conversation" id="conversation" tabindex="0" aria-label="研究对话"><section class="welcome" id="welcome"><h2 id="welcome-title">我们要研究什么？</h2></section><div id="messages" class="messages"></div></div>
 <div class="composer-zone"><div id="activity" class="activity" role="status" aria-live="polite"></div><form id="composer"><label for="question" class="sr-only">研究内容</label><textarea id="question" rows="3" maxlength="6000" placeholder="输入技术名称，或粘贴一段航天新闻…"></textarea><div class="compose-bottom"><span id="input-note">先识别主题，确认检索词后查找论文</span><div><span id="scope">四个论文来源</span><button type="button" id="cancel" class="text-button" hidden>停止等待</button><button type="submit" id="send" class="send" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div></form><p class="composer-foot"><span id="service-note">检索结果请结合原始来源核对。</span><span>Ctrl / ⌘ + Enter 发送</span></p></div>

</div>
</main></div>
<dialog id="paper-dialog" class="paper-dialog" aria-labelledby="paper-title"><button id="close-paper" class="icon dialog-close" aria-label="关闭论文详情">×</button><div id="paper-detail"></div></dialog>
<dialog id="manage-dialog" class="manage-dialog" aria-labelledby="manage-title"><form id="manage-form"><h2 id="manage-title">重命名研究</h2><label for="name-input" id="manage-copy">研究名称</label><input id="name-input" maxlength="60" required autocomplete="off"><div class="dialog-actions"><button type="button" id="manage-cancel">取消</button><button id="manage-confirm" class="primary" type="submit">保存</button></div></form></dialog>
<script src="/assets/article-renderer.js?v=20261023-news-links" defer></script><script src="/assets/research.js?v=20261021-ai-markdown" defer></script></body></html>
