# Load only after a trusted IP certificate has been issued.
server {
    listen 80;
    server_name 8.137.164.100;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/space-news-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name 8.137.164.100;
    ssl_certificate /etc/letsencrypt/live/8.137.164.100/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.137.164.100/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;

    # Preserve the exact endpoint path and both server-controlled auth headers.
    location = /api/news-mcp/mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-News-Context $http_x_news_context;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        # Don't log credentials or raw MCP payloads. App storage records scoped tool calls.
        access_log off;
    }
    location / { return 404; }
}
