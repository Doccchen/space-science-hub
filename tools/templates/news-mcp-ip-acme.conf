# Bootstrap HTTP-01 validation only. Never send MCP credentials over this listener.
server {
    listen 80;
    server_name 8.137.164.100;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/space-news-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
