# IP certificate is shared by the website on 8080 and the MCP-only gateway on 443.
server {
    listen 80;
    server_name 8.137.164.100;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/space-news-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name 8.137.164.100;
    ssl_certificate /etc/letsencrypt/live/8.137.164.100/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.137.164.100/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location = /api/news-mcp/mcp {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-News-Context $http_x_news_context;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        access_log off;
    }
    location / { return 404; }
}

server {
    listen 8080 ssl;
    server_name 8.137.164.100;
    ssl_certificate /etc/letsencrypt/live/8.137.164.100/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.137.164.100/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Legacy homepage links upgrade to the same public port over TLS.
    error_page 497 =308 https://8.137.164.100:8080$request_uri;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_cookie_flags space_ai_visitor secure httponly samesite=strict;
        proxy_cookie_flags space_news_visitor secure httponly samesite=strict;
    }
}
