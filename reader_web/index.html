<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知航 · 论文查找</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/reader-assets/reader.css?v=20261019-audit-fixes"><link rel="stylesheet" href="/assets/site-navigation.css?v=20261019-minimal-copy"></head>
<body><header class="site-header"><a class="brand" id="home-link" href="/#page/news"><img src="/assets/brand.svg" width="48" height="48" alt="" aria-hidden="true"><span class="brand-wordmark"><strong>知航</strong></span></a><nav aria-label="主导航"><a href="/#page/news">航天新闻</a><a href="/assets/research.html">研究助手</a><a href="/assets/resource-navigation.html">资源导航</a></nav><a class="header-about" href="/#page/about">关于本站</a></header>
<main><section class="intro"><div><h1>查找技术<br>背后的研究</h1></div><ol class="steps"><li><span>01</span>输入新闻或技术</li><li><span>02</span>确认检索主题</li><li><span>03</span>查看论文与原文</li></ol></section>
<section class="input-panel" aria-labelledby="input-title"><div class="section-label"><h2 id="input-title">你想了解哪项技术？</h2></div><form id="analyze-form"><label for="news-input">新闻标题、正文或技术名称</label><textarea id="news-input" required minlength="2" maxlength="6000" placeholder="粘贴新闻内容，或输入“绳网回收”“栅格舵”等技术名称…"></textarea><div class="examples"><span>试一试</span><button type="button" data-example="绳网回收技术的捕获过程与动力学">绳网回收</button><button type="button" data-example="栅格舵的气动特性与火箭着陆控制">栅格舵</button><button type="button" data-example="液氧甲烷火箭发动机燃烧稳定性">液氧甲烷发动机</button></div><div class="form-footer"><p id="privacy" class="muted">输入将用于提取技术检索词，不会保存为个人记录。</p><button id="analyze" class="primary">识别技术主题 ↗</button></div></form></section>
<div class="request-status"><p id="status" role="status" aria-live="polite"></p><button id="cancel-request" class="quiet" type="button" hidden>取消等待</button><button id="retry-request" class="quiet" type="button" hidden>重试</button></div>
<section id="topics-panel" class="topics-panel" aria-labelledby="topics-title"><div class="section-label"><h2 id="topics-title">输入检索词，查找相关论文</h2></div><p class="muted">已知道技术名称？可直接检索，无需先识别主题。</p><div id="analysis-results" hidden><p id="analysis-note" class="muted"></p><div id="topics" class="topics" role="group" aria-label="候选技术主题"></div></div><form id="search-form"><label for="query">检索词，可修改后查找</label><div class="query-row"><input id="query" required minlength="2" maxlength="160"><button id="search" class="primary">查找相关论文 →</button></div></form></section>
<section id="results-panel" hidden aria-labelledby="results-title"><div class="results-heading"><div><h2 id="results-title" tabindex="-1">相关论文</h2><p id="result-query" class="muted"></p></div><p id="result-count"></p></div><div id="source-status" class="source-status" aria-label="检索来源状态"></div><p class="scope-note">根据题名、摘要与检索词匹配排序，尚未读取全文。技术相关不代表新闻中的型号采用了论文方法；预印本未必经过同行评审。</p><div class="filters"><label>发表年份<select id="year"><option value="">全部年份</option></select></label><label>文献类型<select id="kind"><option value="">全部类型</option><option>期刊论文</option><option>会议论文</option><option>预印本</option><option>技术报告</option><option>其他文献</option></select></label><label class="check"><input type="checkbox" id="oa">有公开全文入口</label></div><div id="papers"></div><button id="more" class="quiet" hidden>显示更多论文</button></section><section class="external" aria-label="来源网站检索"><span>也可直接到来源网站查找</span><div id="external-links"></div></section>
<footer><span>知航</span><span>Crossref · Semantic Scholar · NASA NTRS · arXiv</span></footer></main><script src="/reader-assets/reader.js?v=20261019-audit-fixes" defer></script></body></html>
