services:
  app:
    image: space-news-app
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    environment:
      NEWS_DB_PATH: /data/news.sqlite3
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-3600}
      COLLECT_ENABLED: "${COLLECT_ENABLED:-1}"
      GOVERNMENT_FULLTEXT_AUTO: ${GOVERNMENT_FULLTEXT_AUTO:-1}
      NEWS_THUMBNAILS_ENABLED: ${NEWS_THUMBNAILS_ENABLED:-0}
      RESOURCE_OSS_ORIGIN: ${RESOURCE_OSS_ORIGIN:-https://space-hub-pub.oss-cn-chengdu.aliyuncs.com}
      RESOURCES_PATH: ${RESOURCES_PATH:-/app/content/resources.json}
      MANAGEMENT_DB_PATH: /data/site-management.sqlite3
      AI_MASTER_KEY_FILE: /run/secrets/site-management.key
      AI_ENABLED: ${AI_ENABLED:-0}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_WORKSPACE_ID: ${BAILIAN_WORKSPACE_ID:-llm-ep9bqc9mnw50k8e0}
      BAILIAN_AGENT_ID: ${BAILIAN_AGENT_ID:-aid-066ddd0b6e1e44d6bf7d620e0ac7c060}
      AI_CONFIG_VERSION: ${AI_CONFIG_VERSION:-1}
      AI_DB_PATH: /data/ai.sqlite3
      AI_COOKIE_SECURE: ${AI_COOKIE_SECURE:-0}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
      AI_VISITOR_DAILY_LIMIT: ${AI_VISITOR_DAILY_LIMIT:-20}
      AI_IP_DAILY_LIMIT: ${AI_IP_DAILY_LIMIT:-30}
      AI_SITE_DAILY_LIMIT: ${AI_SITE_DAILY_LIMIT:-100}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-200000}
      AI_TOKEN_RESERVATION: ${AI_TOKEN_RESERVATION:-20000}
      NEWS_AGENT_ENABLED: ${NEWS_AGENT_ENABLED:-0}
      NEWS_CONTEXT_ENABLED: ${NEWS_CONTEXT_ENABLED:-0}
      NEWS_AGENT_DB_PATH: /data/news-agent.sqlite3
      NEWS_AGENT_APP_ID: ${NEWS_AGENT_APP_ID:-e366df4514cb4606b95821b9d03c387e}
      NEWS_AGENT_WORKSPACE_ID: ${NEWS_AGENT_WORKSPACE_ID:-llm-ep9bqc9mnw50k8e0}
      NEWS_AGENT_REGION: ${NEWS_AGENT_REGION:-beijing}
      NEWS_AGENT_API_KEY: ${NEWS_AGENT_API_KEY:-}
      NEWS_AGENT_CREDENTIALS_FILE: ${NEWS_AGENT_CREDENTIALS_FILE:-}
      NEWS_AGENT_CONFIG_VERSION: ${NEWS_AGENT_CONFIG_VERSION:-news-agent-v1}
      NEWS_MCP_ENABLED: ${NEWS_MCP_ENABLED:-0}
      NEWS_MCP_CONTEXT_VERIFIED: ${NEWS_MCP_CONTEXT_VERIFIED:-0}
      NEWS_MCP_SERVICE_KEY: ${NEWS_MCP_SERVICE_KEY:-}
      NEWS_MCP_PLUGIN_CODE: ${NEWS_MCP_PLUGIN_CODE:-}
    volumes:
      - news-data:/data
      - ./secrets/site-management.key:/run/secrets/site-management.key:ro
    mem_limit: 640m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  admin:
    profiles: [review]
    image: space-news-app
    command: [python, -m, uvicorn, backend.admin_app:app, --host, 0.0.0.0, --port, "8001", --workers, "1"]
    ports:
      - "127.0.0.1:8090:8001"
    environment:
      NEWS_DB_PATH: /data/news.sqlite3
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:18080}
      MANAGEMENT_DB_PATH: /data/site-management.sqlite3
      AI_MASTER_KEY_FILE: /run/secrets/site-management.key
      AI_DB_PATH: /data/ai.sqlite3
      GOVERNMENT_FULLTEXT_AUTO: ${GOVERNMENT_FULLTEXT_AUTO:-1}
    volumes:
      - news-data:/data
      - ./secrets/site-management.key:/run/secrets/site-management.key:ro
    mem_limit: 320m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  news-data:
