services:
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    environment:
      NEWS_DB_PATH: /data/news.sqlite3
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-3600}
      COLLECT_ENABLED: "${COLLECT_ENABLED:-1}"
      GOVERNMENT_FULLTEXT_AUTO: ${GOVERNMENT_FULLTEXT_AUTO:-1}
      RESOURCE_OSS_ORIGIN: ${RESOURCE_OSS_ORIGIN:-https://space-hub-pub.oss-cn-chengdu.aliyuncs.com}
      RESOURCES_PATH: ${RESOURCES_PATH:-/app/content/resources.json}
    volumes:
      - news-data:/data
    mem_limit: 640m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  admin:
    profiles: [review]
    image: space-news-app
    command: [python, -m, uvicorn, backend.admin_app:app, --host, 0.0.0.0, --port, "8001", --workers, "1"]
    ports:
      - "127.0.0.1:8090:8001"
    environment:
      NEWS_DB_PATH: /data/news.sqlite3
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:18080}
      GOVERNMENT_FULLTEXT_AUTO: ${GOVERNMENT_FULLTEXT_AUTO:-1}
    volumes:
      - news-data:/data
    mem_limit: 320m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  news-data:
