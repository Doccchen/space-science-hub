# Include inside the EXISTING HTTPS server block. Root/news routes stay unchanged.
location = /reader { return 308 /reader/; }
location /reader/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $http_host;
}
location /reader-assets/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $http_host;
}
location /api/reader/ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $http_host;
    proxy_set_header X-Reader-Client-IP $remote_addr;
    proxy_read_timeout 90s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_no_cache 1;
}
