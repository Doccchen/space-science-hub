<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新闻人工审核</title><link rel="stylesheet" href="/admin.css"></head><body>
<header><strong>新闻人工审核</strong><span id="account"></span><button id="logout" hidden>退出登录</button></header>
<p id="message" role="status"></p>
<section id="login"><h1>管理员登录</h1><p>通过SSH转发访问此后台。账号由服务器初始化，没有默认密码。</p><form id="login-form"><label>账号<input id="username" autocomplete="username" required maxlength="64"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="200"></label><button>登录</button></form></section>
<main id="workspace" hidden><section id="queue"><h1>政府新闻审核队列</h1><p>其他机构和企业继续原文阅读。抓取不会自动产生转载许可。</p><form id="search-form"><input id="search" placeholder="搜索新闻标题" maxlength="120"><button>搜索</button></form><div id="articles"></div><div class="pager"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<section id="editor" hidden><button id="back">返回队列</button><h1 id="title"></h1><p id="meta"></p><a id="original" target="_blank" rel="noopener noreferrer">打开原文核对 ↗</a><div class="actions"><button id="capture">抓取待审核正文</button><button id="reload">重新读取审核状态</button></div><p id="capture-notice">待审核材料仅在后台可见，请逐段核对来源、数字、单位和限定语。</p>
<div id="draft" hidden><h2>正文与署名</h2><label>正文语言<input id="language" maxlength="20"></label><label>内容署名<input id="credit" maxlength="1000"></label><div id="blocks"></div><button id="add-paragraph">增加段落</button>
<h2>正文转载依据</h2><label>许可类型<select id="permission"><option value="pending">待确认</option><option value="policy_reviewed">符合已核对的公开条款</option><option value="explicit_grant">已取得明确授权</option></select></label><label>条款地址/授权依据<textarea id="basis" maxlength="4000"></textarea></label><label>正文权利人<input id="rightsholder" maxlength="1000"></label><label>第三方内容与例外核对<textarea id="exceptions" maxlength="4000"></textarea></label><label>有效期（可空，带时区的ISO时间）<input id="expiry" placeholder="2027-01-01T00:00:00+08:00"></label><label>向读者显示的使用说明<textarea id="notes" maxlength="4000"></textarea></label>
<label class="check"><input id="license-checked" type="checkbox">已确认允许本站公开展示这篇正文，并保留必要署名</label><label class="check"><input id="complete-checked" type="checkbox">已对照原文核对完整性、顺序、数字和限定语</label><label class="check"><input id="republish" type="checkbox">若曾撤回，明确批准重新发布本版本</label><div class="actions"><button id="save">保存待审核草稿</button><button id="approve" class="primary">审核通过并发布</button></div></div>
<div class="withdraw"><label>撤回原因<input id="withdraw-reason" maxlength="2000"></label><button id="withdraw">撤回已发布正文</button></div><h2>图片单独审核</h2><p id="storage"></p><div id="images"></div><h2>已保存图片</h2><div id="assets"></div><h2>抓取与保存任务</h2><p>后台任务完成后会刷新状态；失败可检查原因后重新提交，历史正文保持。</p><div id="jobs"></div></section></main>
<script src="/admin.js"></script></body></html>
