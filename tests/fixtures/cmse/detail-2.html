<div class="wzxq"><div class="title"> 中共中央、国务院、中央军委决定给张陆、武飞、张洪章颁发航天功勋奖章 </div><div class="pubDate">发布日期: <span>2026-08-20</span></div><div class="source">信息来源: <span>新华社</span></div><div class="article" id="dochtmlcon" style="display:none"><p>中共中央 国务院 中央军委 关于给张陆颁发“二级航天功勋奖章” 授予武飞、张洪章“英雄航天员”荣誉称号 并颁发“三级航天功勋奖章”的决定 （2026年8月20日） 2025年10月31日，神舟二十一号载人飞船成功发射，航天员张陆、武飞、张洪章驾乘飞船顺利进驻天和核心舱，在轨驻留7个月，先后进行3次出舱活动，完成110余</p></div></div>
