               我国成功发射秦岭卫星01、02星等9颗卫星
            </div><span class="wz_rq"> 发布时间：2026-09-20</span><span class="wz_ly"> 来源：中国的航天 </span><div class="wz_conten"><p>9月20日12时03分，我国在东风商业航天创新试验区使用力箭一号遥十八运载火箭，成功将秦岭卫星01、02星，浦江四号卫星、鹏城首发星、谛听01组A/B/C星、超智算一号卫星、云霄探路者卫星等9颗卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。 此次任务是力箭一号运载火箭的第16次飞行。 字体： 【大】 【中】</p></div>
