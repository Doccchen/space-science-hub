               一箭十星 朱雀二号改进型遥七运载火箭发射成功
            </div><span class="wz_rq"> 发布时间：2026-09-16</span><span class="wz_ly"> 来源：中国的航天 </span><div class="wz_conten"><p>9月15日14时26分，朱雀二号改进型遥七运载火箭在东风商业航天创新试验区发射升空，将搭载的千帆极轨19组共10颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。 字体： 【大】 【中】 【小】 【关闭】 【打印】</p></div>
