               我国成功发射株洲太空星际PIESAT-2 13~16星
            </div><span class="wz_rq"> 发布时间：2026-09-19</span><span class="wz_ly"> 来源：中国的航天 </span><div class="wz_conten"><p>9月19日18时50分，我国在太原卫星发射中心使用长征二号丁运载火箭，成功将株洲太空星际PIESAT-2 13～16星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。 长征二号丁运载火箭是由航天科技集团八院抓总研制的常温液体二级运载火箭，具有“可靠性高、经济性好、适应性强”等特点，具备不同轨道要求下单星、多星发射</p></div>
