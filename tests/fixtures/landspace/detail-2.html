<div class="page-news-detail"><h3 class="title">蓝箭航天党委获评“全国先进基层党组织”称号</h3><div class="times">
<span>发布时间：2026-07-02</span>
<span>文章来源：蓝箭航天</span>
</div><div class="article"><p>7月1日，全国“两优一先”表彰名单公布，蓝箭航天空间科技股份有限公司党委获评“全国先进基层党组织”。这是继获评北京市先进基层党组织后，蓝箭航天党委获得的又一项重要荣誉。 航天领域这些集体和个人获全国“两优一先”表彰 □ 2025年，朱雀三号重复使用运载火箭试验任务期间，党员突击队部分人员与产品合影。 荣誉是鼓励，更是责</p></div></div>
