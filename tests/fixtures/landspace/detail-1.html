<div class="page-news-detail"><h3 class="title">朱雀三号重复使用遥二运载火箭实现入轨及回收圆满成功</h3><div class="times">
<span>发布时间：2026-08-19</span>
<span>文章来源：蓝箭航天</span>
</div><div class="article"><p>北京时间2026年8月19日7时35分，朱雀三号重复使用遥二运载火箭在东风商业航天创新试验区发射升空。起飞约137秒，火箭一二级分离，二子级继续飞行，将鸿擎科技自主研制的鸿鹄03星准确送入预定轨道；7时41分许，火箭一子级按预定程序成功软着陆于甘肃省民勤县朱雀三号着陆场坪，飞行试验任务取得圆满成功。 本次任务是我国首次</p></div></div>
