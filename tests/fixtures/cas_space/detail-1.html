<div class="detail-title">中科宇航与超智算跨界合作，开启太空算力新探索</div><div class="detail-info"><div>发布时间：<span>2026/09/20</span></div></div><div class="detail-content" id="content-text"><p>2026年9月20日12时03分， 中科宇航力箭一号遥十八运载火箭·超智算号成功发射 。此次任务中，力箭一号携手超智算（北京）科技有限公司，以全国首个“首箭首星”一体化算力卫星项目为载体，推动算力基础设施从地面向浩瀚太空跨越，开启“算力上天”的全新探索。 本次发射火箭由超智算独家冠名，开创了国内算力领域运载火箭独家冠名</p></div>
