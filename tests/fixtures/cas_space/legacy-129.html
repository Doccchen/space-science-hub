</div><div class="detail-content" id="content-text"><p>2025年12月10日12时03分，力箭一号遥十一运载火箭 · 缔造未来号在东风商业航天创新试验区成功点火升空，发射任务取得圆满成功。此次发射由中科宇航携手中国宋庆龄基金会以公益冠名方式联合开展， 标志着中国商业航天首次将教育理想、文化内核</p></div>
