<div class="detail-title">中科宇航深化太空制药合作，力鸿二号计划2027年携医药载荷首飞</div><div class="detail-info"><div>发布时间：<span>2026/09/28</span></div></div><div class="detail-content" id="content-text"><p>近日，中科宇航与广州实验室围绕太空制药载荷开展联合研制攻关，并拟联合开展太空制药场景验证。 首批 载荷计划于 2027年第一季度搭乘力鸿二号可重复使用运载器开展亚轨道飞行验证 ，实施蛋白质和小分子药物结晶实验， 开展太空制药装备的前期技术验证。 医工交叉开展太空制药探索 广 州 实验室研究员徐强（右）与中科宇航创新研究</p></div>
