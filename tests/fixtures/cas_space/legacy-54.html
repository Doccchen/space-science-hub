<div class="detail-title">一箭六星！我国迄今运载能力最大的固体运载火箭“力箭一号”首飞成功</div><div class="detail-info">
<div>来源：<span>中科宇航</span></div>
<div>发布时间：<span>2022/07/27</span></div>

</div><div class="detail-content" id="content-text"><p>2022年7月27日12时12分，由中国科学院力学研究所（以下简称“中科院力学所”）抓总研制的“力箭一号”（ZK-1A）运载火箭在酒泉卫星发射中心成功发射，采用“一箭六星”的方式，成功将六颗卫星送入预定轨道，“力箭一号”运载火箭首次飞行任务</p></div>
