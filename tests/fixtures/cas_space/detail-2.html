<div class="detail-title">力箭一号遥十八运载火箭圆满完成“一箭9星”发射，以高密度发射保障充足市场订单履约</div><div class="detail-info"><div>发布时间：<span>2026/09/20</span></div></div><div class="detail-content" id="content-text"><p>2026年 9月20日12时03分， 中科宇航力箭一号遥十八运载火箭 ·超智算号在东风商业航天创新试验区发射 ，采用 “一箭9星”的方式，将“超智算一号”等9颗卫星精准送入预定轨道，发射任务取得圆满成功，该批卫星主要用于 空间环境监测、防灾减灾和科学试验等领域 。 此次任务采用 一箭多星发射 模式，加速 小型卫星星座组</p></div>
